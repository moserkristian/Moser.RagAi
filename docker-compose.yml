services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: desk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: desk
    ports:
      - "5432:5432"
    volumes:
      - desk-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desk -d desk"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Desk: Host=db;Port=5432;Database=desk;Username=desk;Password=${POSTGRES_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      Desk__Users__0__UserName: ${DESK_USER_NAME:?Set DESK_USER_NAME in .env}
      Desk__Users__0__Password: ${DESK_USER_PASSWORD:?Set DESK_USER_PASSWORD in .env}
      Embeddings__Directory: /app/models
    ports:
      - "8080:8080"

volumes:
  desk-data:
